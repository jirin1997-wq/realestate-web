version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: realestate_db
    environment:
      POSTGRES_USER: realestateuser
      POSTGRES_PASSWORD: realestatepass
      POSTGRES_DB: realestate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestateuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
